name: CI

on:
  pull_request:
  push:
    branches:
      - stage
      - product-readiness-from-stage

jobs:
  smoke:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Compile Python sources
        run: python -m compileall app bot scripts migrations run.py run_bot.py run_admin_bot.py

      - name: Run smoke tests
        run: pytest
