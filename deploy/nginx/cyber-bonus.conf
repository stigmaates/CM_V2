# Template. Adjust server_name, TLS paths, root paths, and upload alias before use.

upstream cyber_bonus_web {
    server 127.0.0.1:8000;
}

server {
    listen 80;
    server_name cyber-bonus.example.com;

    # Redirect to HTTPS after TLS is configured.
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name cyber-bonus.example.com;

    ssl_certificate /etc/letsencrypt/live/cyber-bonus.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/cyber-bonus.example.com/privkey.pem;

    client_max_body_size 8m;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    location /static/ {
        alias /opt/cyber-bonus/app/static/;
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
    }

    location /uploads/ {
        alias /var/www/clubmodule_uploads/stage/;
        expires 1d;
        add_header Cache-Control "public, max-age=86400";
        try_files $uri =404;
    }

    location /healthz {
        proxy_pass http://cyber_bonus_web;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /readyz {
        proxy_pass http://cyber_bonus_web;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://cyber_bonus_web;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
}
