<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cyber Bonus</title>
    <link rel="icon" type="image/png" sizes="32x32" href="{{ url_for('static', filename='favicon/favicon-32x32.png') }}?v=20260729">
    <style>
        :root { color-scheme: dark; }
        * { box-sizing: border-box; }
        body {
            min-height: 100vh;
            margin: 0;
            display: grid;
            place-items: center;
            padding: 24px;
            font-family: Inter, Arial, sans-serif;
            color: #f7f1ff;
            background: #0d0618;
        }
        .ban-message {
            width: min(560px, 100%);
            padding: 34px;
            border: 1px solid rgba(165, 114, 255, 0.42);
            border-radius: 18px;
            background: #1b0f31;
            text-align: center;
            box-shadow: 0 24px 70px rgba(0, 0, 0, 0.38);
        }
        .ban-message img { width: 58px; height: 58px; object-fit: contain; }
        .ban-message h1 { margin: 22px 0 10px; font-size: 28px; letter-spacing: 0; }
        .ban-message p { margin: 0; color: #c7b7df; font-size: 17px; line-height: 1.5; }
        .ban-message a {
            display: inline-flex;
            margin-top: 26px;
            padding: 12px 22px;
            border-radius: 10px;
            color: #fff;
            background: #7542d8;
            font-weight: 800;
            text-decoration: none;
        }
    </style>
</head>
<body>
    <main class="ban-message">
        <img src="{{ url_for('static', filename='img/cyber-bonus-logo.png') }}" alt="Cyber Bonus">
        <h1>Доступ ограничен</h1>
        <p>Пожалуйста, обратитесь к администрации клуба.</p>
        <a href="{{ url_for('guest.logout') }}">Выйти</a>
    </main>
</body>
</html>
