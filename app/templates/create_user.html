<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="csrf-token" content="{{ csrf_token() }}">
    <title>Создание пользователя</title>
    <link rel="icon" type="image/png" sizes="32x32" href="{{ url_for('static', filename='favicon/favicon-32x32.png') }}?v=20260729">
    <link rel="icon" type="image/png" sizes="512x512" href="{{ url_for('static', filename='favicon/favicon-512x512.png') }}?v=20260729">
    <link rel="apple-touch-icon" href="{{ url_for('static', filename='favicon/favicon-512x512.png') }}?v=20260729">

    <link rel="stylesheet" href="{{ url_for('static', filename='css/theme.css') }}">
</head>
<body class="auth-page">
    <div class="card center-card">
        <h1 class="auth-title">Создание пользователя</h1>

        {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
                {% for category, message in messages %}
                    <div class="flash {{ category }}">{{ message }}</div>
                {% endfor %}
            {% endif %}
        {% endwith %}

        <form class="auth-form" method="POST">
            <div class="form-group">
                <label for="role">Роль</label>
                <input class="form-input" type="text" id="role" name="role" placeholder="Например: admin" required>
            </div>

            <div class="form-group">
                <label for="name">Имя</label>
                <input class="form-input" type="text" id="name" name="name" placeholder="Иван Иванов" required>
            </div>

            <div class="form-group">
                <label for="login">Логин</label>
                <input class="form-input" type="text" id="login" name="login" placeholder="ivanov" required>
            </div>

            <div class="form-group">
                <label for="club_id">Club ID</label>
                <input class="form-input" type="number" id="club_id" name="club_id" placeholder="1" required>
            </div>

            <div class="form-group">
                <label for="password">Пароль</label>
                <input class="form-input" type="password" id="password" name="password" required>
            </div>

            <button class="btn" style="margin-top: 10px; width: 100%;" type="submit">Создать пользователя</button>
        </form>
    </div>
    <script src="{{ url_for('static', filename='js/csrf.js') }}"></script>
</body>
</html>
