    <div class="crm-campaign-modal" id="crmPulseModal" aria-hidden="true">
        <div class="crm-campaign-modal__backdrop" id="crmPulseBackdrop"></div>
        <div class="crm-campaign-modal__dialog crm-pulse-modal__dialog" role="dialog" aria-modal="true" aria-labelledby="crmPulseTitle">
            <div class="crm-campaign-modal__header">
                <div>
                    <div class="crm-campaign-modal__eyebrow" id="crmPulseSubtitle">Пульс базы</div>
                    <h2 id="crmPulseTitle">Взаимодействие с группой</h2>
                </div>
                <button type="button" class="crm-campaign-modal__close" id="crmPulseClose" aria-label="Закрыть">×</button>
            </div>
            <div class="crm-campaign-modal__body" id="crmPulseBody">
                <div class="crm-pulse-modal-grid">
                    <section class="crm-campaign-passport-block">
                        <h3>Получатели</h3>
                        <div class="crm-pulse-recipient-summary" id="crmPulseRecipientSummary"></div>
                        <div class="crm-pulse-recipient-list" id="crmPulseRecipientList"></div>
                    </section>
                    <section class="crm-campaign-passport-block">
                        <h3>Сообщение и награда</h3>
                        <label class="crm-pulse-field">
                            <span>Сообщение</span>
                            <textarea id="crmPulseMessage" placeholder="{first_name}, привет! Есть повод заглянуть к нам на этой неделе."></textarea>
                        </label>
                        <div class="crm-pulse-variable-row">
                            <select id="crmPulseVariableSelect" aria-label="Данные гостя для вставки"></select>
                            <button type="button" class="crm-analysis-button" id="crmPulseInsertVariable">Вставить</button>
                        </div>
                        <div class="crm-pulse-reward-grid">
                            <label class="crm-pulse-field">
                                <span>КБ</span>
                                <input type="number" id="crmPulseBonusAmount" min="0" step="1" value="0">
                            </label>
                            <label class="crm-pulse-field">
                                <span>Жетоны</span>
                                <input type="number" id="crmPulseTokenAmount" min="0" step="1" value="0">
                            </label>
                        </div>
                        <label class="crm-pulse-check">
                            <input type="checkbox" id="crmPulseExpiringBonus">
                            <span>Сгорающая раздача</span>
                        </label>
                        <div class="crm-pulse-expiration" id="crmPulseExpiration" hidden>
                            <label class="crm-pulse-field">
                                <span>Сгорит через</span>
                                <input type="number" id="crmPulseExpiresValue" min="1" step="1" value="7">
                            </label>
                            <label class="crm-pulse-field">
                                <span>Единица</span>
                                <select id="crmPulseExpiresUnit">
                                    <option value="minutes">Минут</option>
                                    <option value="hours">Часов</option>
                                    <option value="days" selected>Дней</option>
                                </select>
                            </label>
                        </div>
                        <button type="button" class="crm-analysis-button crm-analysis-button--primary crm-pulse-submit" id="crmPulseSubmit">
                            Отправить
                        </button>
                        <button type="button" class="crm-analysis-button crm-pulse-dismiss" id="crmPulseDismiss">
                            Убрать из пульса
                        </button>
                        <div class="crm-pulse-status" id="crmPulseStatus" aria-live="polite"></div>
                    </section>
                </div>
            </div>
        </div>
    </div>
