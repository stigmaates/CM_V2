<div class="demo-card-head"><div><h2>Гости клуба</h2><p>Случайные данные для демонстрации</p></div><button class="demo-outline" data-demo-refresh>Пересчитать</button></div>
<div class="demo-table-wrap"><table class="demo-table"><thead><tr><th>Гость</th><th>Статус</th><th>П</th><th>Ц</th><th>В</th><th>Общий балл</th></tr></thead><tbody>{% for row in rows %}<tr data-demo-row><td><b>{{ row.name }}</b><small>ID {{ row.id }} · C Telegram</small></td><td><span class="demo-tag">{{ row.status }}</span></td><td>{{ row.visits }}</td><td>{{ row.value }}</td><td>{{ row.engagement }}</td><td><strong>{{ row.score }}</strong></td></tr>{% endfor %}</tbody></table></div>
