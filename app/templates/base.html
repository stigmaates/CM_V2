<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Cyber Bonus{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/theme.css') }}">
</head>
<body>
    <div class="page">
        <div class="topbar">
            <div class="logo">Cyber Bonus</div>

            <div class="nav">
                <a href="{{ url_for('dashboard') }}" class="{% if request.endpoint == 'dashboard' %}active{% endif %}">Дашборд</a>
                <a href="{{ url_for('settings') }}" class="{% if request.endpoint == 'settings' %}active{% endif %}">Настройки</a>
                <a href="{{ url_for('missions') }}" class="{% if request.endpoint in ['missions', 'missions_add', 'missions_update', 'missions_disable'] %}active{% endif %}">Задания</a>
                <a href="{{ url_for('wheel_settings') }}" class="{% if request.endpoint in ['wheel_settings', 'wheel_prize_add', 'wheel_prize_update', 'wheel_prize_delete'] %}active{% endif %}">Колесо фортуны</a>
                <a href="{{ url_for('mailing_page') }}" class="{% if request.endpoint == 'mailing_page' %}active{% endif %}">Рассылка</a>
            </div>
        </div>

        {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
                {% for category, message in messages %}
                    <div class="flash {{ category }}">{{ message }}</div>
                {% endfor %}
            {% endif %}
        {% endwith %}

        {% block content %}{% endblock %}
    </div>
</body>
</html>
